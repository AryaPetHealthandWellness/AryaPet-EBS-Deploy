name: Deploy to Elastic Beanstalk (dev)

# Auto-deploys once CI has passed on main. workflow_dispatch is kept as a manual
# fallback (e.g. re-deploying the current main commit without a new push).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# arya-ebstalk-dev-env is a SingleInstance environment - it can only apply one
# update-environment call at a time. Without this, two deploys triggered close
# together (e.g. two quick pushes to main) race and one gets aborted mid-deploy,
# leaving the instance on neither version cleanly. Queue instead of racing or
# cancelling - cancelling the workflow run wouldn't stop the AWS-side update that's
# already in flight, so cancel-in-progress would just recreate the same race.
concurrency:
  group: deploy-eb-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EB_APPLICATION_NAME: arya-ebstalk-dev
  EB_ENVIRONMENT_NAME: arya-ebstalk-dev-env

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_EB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deploy version label
        id: version
        run: echo "label=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Package source bundle
        run: |
          zip -r deploy.zip . \
            -x ".git/*" ".github/*" ".venv/*" "**/__pycache__/*" \
               "tests/*" ".pytest_cache/*" ".ruff_cache/*"

      - name: Resolve EB's default S3 bucket
        id: eb_bucket
        run: |
          BUCKET=$(aws elasticbeanstalk create-storage-location --query 'S3Bucket' --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Upload source bundle
        run: |
          aws s3 cp deploy.zip \
            "s3://${{ steps.eb_bucket.outputs.bucket }}/${EB_APPLICATION_NAME}/${{ steps.version.outputs.label }}.zip"

      - name: Create application version
        # Idempotent: re-running for a commit whose version already exists (e.g. a manual
        # re-dispatch after a later step failed) would otherwise fail with "Application
        # Version ... already exists".
        run: |
          VERSION_LABEL="${{ steps.version.outputs.label }}"
          EXISTING=$(aws elasticbeanstalk describe-application-versions \
            --application-name "${EB_APPLICATION_NAME}" \
            --version-labels "$VERSION_LABEL" \
            --query "ApplicationVersions[0].VersionLabel" --output text)

          if [ "$EXISTING" = "$VERSION_LABEL" ]; then
            echo "Application version $VERSION_LABEL already exists, skipping creation."
          else
            aws elasticbeanstalk create-application-version \
              --application-name "${EB_APPLICATION_NAME}" \
              --version-label "$VERSION_LABEL" \
              --source-bundle S3Bucket="${{ steps.eb_bucket.outputs.bucket }}",S3Key="${EB_APPLICATION_NAME}/$VERSION_LABEL.zip" \
              --region "${AWS_REGION}"
          fi

      - name: Deploy application version
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${EB_ENVIRONMENT_NAME}" \
            --version-label "${{ steps.version.outputs.label }}" \
            --region "${AWS_REGION}"

      - name: Wait for environment update to finish
        # Not `aws elasticbeanstalk wait environment-updated`: its fixed ~6.5 min budget
        # (20 x 20s) is shorter than the on-instance Docker build (spaCy + model download
        # on a t3.micro), so it gave up while the update was still progressing.
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws elasticbeanstalk describe-environments \
              --environment-names "${EB_ENVIRONMENT_NAME}" \
              --region "${AWS_REGION}" \
              --query 'Environments[0].Status' --output text)
            if [ "$STATUS" = "Ready" ]; then
              echo "Environment is Ready"
              exit 0
            fi
            echo "Environment status: $STATUS, waiting ($i/60)..."
            sleep 20
          done
          echo "::error::Environment still not Ready after 20 minutes"
          exit 1

      - name: Verify environment health
        run: |
          STATUS=$(aws elasticbeanstalk describe-environments \
            --environment-names "${EB_ENVIRONMENT_NAME}" \
            --region "${AWS_REGION}" \
            --query 'Environments[0].Health' --output text)
          echo "Environment health: $STATUS"
          if [ "$STATUS" != "Green" ] && [ "$STATUS" != "Ok" ]; then
            echo "::error::Environment health is $STATUS after deploy"
            exit 1
          fi

          # EB's self-reported Health can read Green just as the container comes up,
          # before it's actually accepting requests. Confirm with a real request
          # instead of trusting the platform's status alone.
          CNAME=$(aws elasticbeanstalk describe-environments \
            --environment-names "${EB_ENVIRONMENT_NAME}" \
            --region "${AWS_REGION}" \
            --query 'Environments[0].CNAME' --output text)

          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://${CNAME}/health" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "GET /health -> 200"
              exit 0
            fi
            echo "GET /health -> $CODE, retrying ($i/5)..."
            sleep 10
          done
          echo "::error::/health did not return 200 after deploy"
          exit 1

      - name: Dump diagnostics on failure
        # Mirrors the manual triage steps needed to root-cause a bad deploy: instance
        # health causes, recent environment events, and the crashed container's actual
        # stdout/stderr (CloudWatch log streaming can lag or stop entirely once
        # eb-docker/nginx die, so pull the tail logs directly instead of relying on it).
        if: failure()
        run: |
          echo "::group::Instance health causes"
          aws elasticbeanstalk describe-instances-health \
            --environment-name "${EB_ENVIRONMENT_NAME}" \
            --region "${AWS_REGION}" \
            --attribute-names All \
            --query 'InstanceHealthList[0].{Status:HealthStatus,Causes:Causes,Deployment:Deployment}' \
            --output json || true
          echo "::endgroup::"

          echo "::group::Recent environment events"
          aws elasticbeanstalk describe-events \
            --environment-name "${EB_ENVIRONMENT_NAME}" \
            --region "${AWS_REGION}" \
            --max-items 20 \
            --query 'Events[].{Time:EventDate,Severity:Severity,Message:Message}' \
            --output table || true
          echo "::endgroup::"

          echo "::group::Instance tail logs"
          aws elasticbeanstalk request-environment-info \
            --environment-name "${EB_ENVIRONMENT_NAME}" \
            --info-type tail \
            --region "${AWS_REGION}" || true
          sleep 20
          URL=$(aws elasticbeanstalk retrieve-environment-info \
            --environment-name "${EB_ENVIRONMENT_NAME}" \
            --info-type tail \
            --region "${AWS_REGION}" \
            --query 'EnvironmentInfo[0].Message' --output text || true)
          [ -n "$URL" ] && [ "$URL" != "None" ] && curl -s "$URL" || echo "Could not retrieve tail logs"
          echo "::endgroup::"
